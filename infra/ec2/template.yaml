AWSTemplateFormatVersion: "2010-09-09"
Description: >
  HubMktDigital - instancia unica EC2 pra rodar o orquestrador Telegram
  (REDIS/agente-julio/main_telegram.py) como servico systemd.
  Sem ALB (nao e web app, so long-polling de saida pro Telegram + Redis Cloud
  + APIs Google). Substitui a instancia criada manualmente (i-0dab47533bf909d2b).

Parameters:
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: "Key pair existente (ex. IF-AWS) usada pro acesso SSH."

  SSHAllowedCidr:
    Type: String
    Description: "CIDR autorizado a conectar via SSH (ex. SEU_IP/32). Nunca 0.0.0.0/0."
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: "VPC onde a instancia sobe (pode ser a VPC default da conta)."

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: "Subnet publica dentro da VpcId acima (a instancia precisa de IP publico/EIP)."

  InstanceType:
    Type: String
    Default: t4g.micro
    AllowedValues:
      - t4g.micro
      - t4g.small
      - t3.micro
      - t3.small
    Description: t4g.* = ARM (Graviton, mais barato); precisa da AMI ARM correspondente.

  UbuntuAmiParameter:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/arm64/hvm/ebs-gp3/ami-id
    Description: >
      AMI resolvida via SSM (sempre a mais recente). Default = Ubuntu 24.04 LTS
      ARM64 (estavel/testada). Se trocar InstanceType pra x86 (t3.*), trocar
      tambem este parametro pro path "amd64".

Resources:
  BotSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VpcId
      GroupDescription: SSH restrito ao IP autorizado; sem porta de entrada publica.
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHAllowedCidr
          Description: SSH restrito ao IP administrativo autorizado.
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Saida livre (Telegram API, Redis Cloud, APIs Google, apt).
      Tags:
        - Key: Name
          Value: hubmktdigital-bot-sg

  BotInstanceManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Permissao minima do bot pra mandar logs pro CloudWatch.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/hubmktdigital/*"

  BotInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
        - !Ref BotInstanceManagedPolicy

  BotInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref BotInstanceRole

  BotInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref UbuntuAmiParameter
      KeyName: !Ref KeyPairName
      IamInstanceProfile: !Ref BotInstanceProfile
      SubnetId: !Ref SubnetId
      EbsOptimized: true
      SecurityGroupIds:
        - !Ref BotSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          apt-get update -y
          apt-get install -y python3-venv python3-pip rsync

          install -d -o ubuntu -g ubuntu /opt/hubmktdigital

          cat > /etc/systemd/system/hubmkt-bot.service <<'UNIT'
          [Unit]
          Description=HubMktDigital - orquestrador Telegram (Julio)
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=ubuntu
          WorkingDirectory=/opt/hubmktdigital/REDIS/agente-julio
          EnvironmentFile=/opt/hubmktdigital/.env
          ExecStart=/opt/hubmktdigital/.venv/bin/python main_telegram.py
          Restart=always
          RestartSec=5
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
          UNIT

          systemctl daemon-reload
          # Nao da "enable --now" aqui: o codigo ainda nao foi sincronizado
          # (isso e feito por infra/ec2/deploy.sh depois que a instancia sobe).
          systemctl enable hubmkt-bot.service

      Tags:
        - Key: Name
          Value: hubmktdigital-bot

  BotElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref BotInstance
      Tags:
        - Key: Name
          Value: hubmktdigital-bot-eip

Outputs:
  InstanceId:
    Value: !Ref BotInstance
  PublicIp:
    Value: !Ref BotElasticIP
  SSHCommand:
    Value: !Sub "ssh -i \"C:/Users/rezen/.ssh/IF-AWS.pem\" ubuntu@${BotElasticIP}"
